[project]
name = "support_triage"
version = "0.1.0"
description = "support_triage using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.39,<2.0.0"
]

[project.scripts]
kickoff = "support_triage.main:kickoff"
run_crew = "support_triage.main:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "b90c643a-1688-4180-b436-ac953df8b6df"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["unittests.py"]