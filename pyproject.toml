[project]
name = "support_triage"
version = "0.1.0"
description = "support_triage using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.39,<2.0.0"
]

[project.scripts]
kickoff = "support_triage.main:kickoff"
run_crew = "support_triage.main:kickoff"
plot = "support_triage.main:plot"
